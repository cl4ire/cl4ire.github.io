<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GéoBercé - Le SIG local</title>

    <!-- DEBUT STYLES -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
    <link rel="stylesheet" href="https://unpkg.com/leaflet.locatecontrol/dist/L.Control.Locate.min.css">
    <link rel="stylesheet" href="css/style.css">
    <!-- FIN STYLES -->
</head>

<body>
    <!-- DEBUT HEADER -->
    <header id="topbar">
        <div id="brand">
            <div id="brand-icon">
                🌳
            </div>
            <div>
                <div id="brand-title">
                    GéoBercé
                </div>
                <div id="brand-subtitle">
                    Le SIG local
                </div>
            </div>
        </div>

        <!-- RECHERCHE -->
        <div id="search-container">
            <span id="search-icon">
                🔎
            </span>
            <input
                type="text"
                id="search"
                placeholder="Rechercher un lieu, une adresse..."
                autocomplete="off"
            >
            <div id="suggestions"></div>
        </div>

        <!-- ACTIONS -->
        <div id="topbar-actions">
            <button type="button" id="about-button">
                À propos
            </button>

            <button type="button" id="menu-button" aria-label="Menu">
                ☰
            </button>
        </div>
    </header>
    <!-- FIN HEADER -->

    <!--DEBUT APPLICATION -->
    <main id="app">
        <!-- DEBUT ARBRE DES COUCHES-->
        <aside id="layers-panel" aria-label="Couches cartographiques">
            <div class="panel-header">
                <div class="panel-title">
                    <span class="panel-icon">
                        ▱
                    </span>
                    <span>
                        Couches
                    </span>
                </div>

                <button type="button" class="panel-close" id="layers-close" aria-label="Fermer">
                    ×
                </button>
            </div>

            <!-- RECHERCHE DES COUCHES -->
            <div id="layers-search">
                <span>
                    🔎
                </span>
                <input
                    type="text"
                    id="layers-filter"
                    placeholder="Filtrer les couches..."
                    autocomplete="off"
                >
            </div>

            <!-- LISTE DES COUCHES -->
            <div id="layers-tree">
                <!-- Généré automatiquement par map.js -->
            </div>
        </aside>
        <!-- FIN ARBRE DES COUCHES-->

        <!-- CARTE -->
        <div id="map"></div>

        <!-- DEBUT FICHE D'INFORMATION -->
        <aside id="info-panel" aria-label="Informations">
            <button type="button" id="info-close" class="info-close" aria-label="Fermer">
                ×
            </button>
            <div id="info-content">
                <!-- La fiche sera injectée ici -->
            </div>
        </aside>
        <!-- FIN FICHE D'INFORMATION -->
    </main>
    <!--FIN APPLICATION -->


    <!-- DEBUT SCRIPTS -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://unpkg.com/leaflet.locatecontrol/dist/L.Control.Locate.min.js"></script>

    <script src="js/icones.js"></script>

    <script src="js/tourisme.js"></script>
    <script src="js/service.js"></script>
    <script src="js/sante.js"></script>
    <script src="js/urbanisme.js"></script>
    <script src="js/mobilite.js"></script>
    <script src="js/famille.js"></script>
    <script src="js/environnement.js"></script>

    <script src="js/map.js"></script>
    <!-- FIN SCRIPTS -->
</body>

</html>
