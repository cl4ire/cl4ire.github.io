name: Données des territoires (OpenStreetMap, SIRENE, RNA)

# Construit les couches de données de GéoSudSarthe et GéoBelinois (ou d'un autre territoire
# de territoires/) depuis les sources publiques :
# - OpenStreetMap via Overpass (outils/build_osm.py) : commerces, services, santé, sports, nature...
# - autres sources ouvertes (outils/build_sources.py) : mairies, boîtes aux lettres, bornes de recharge, covoiturage,
#   France services, monuments historiques, bus Aléop, argiles, zonage d'urbanisme, DPE, défibrillateurs, élus
# - petite enfance (outils/build_petite_enfance.py) : exports monenfant.fr déposés dans territoires/<id>/saisie/
# - prix de l'immobilier et parcelles vendues (outils/build_dvf.py, DVF + cadastre)
# - registre SIRENE (outils/build_artisans.py) : artisans
# - répertoire des associations RNA (outils/build_associations.py)
# puis met à jour `fichiersDisponibles` de chaque territoire (outils/maj_fichiers_disponibles.py)
# et commite directement sur main (seuls les dossiers territoires/<id>/ changent : GéoBercé n'est pas touché).
# Chaque étape qui échoue est signalée, les autres sont quand même gardées.
on:
  schedule:
    - cron: '41 4 8 * *'
  workflow_dispatch:
    inputs:
      territoires:
        description: "Territoires à mettre à jour, séparés par des espaces"
        default: "geosudsarthe geobelinois"

permissions:
  contents: write

jobs:
  donnees:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4

      - name: Données de chaque territoire
        id: donnees
        env:
          TERRITOIRES_ENTREE: ${{ github.event.inputs.territoires }}
        run: |
          # Pas de « set -e » : GitHub lance bash avec -e, qu'on retire pour qu'une étape en échec n'arrête pas les autres.
          set +e
          set -uo pipefail
          TERRITOIRES="${TERRITOIRES_ENTREE:-geosudsarthe geobelinois}"
          RAPPORT="territoires/rapport-donnees.txt"
          echo "Données des territoires, $(date -u +%Y-%m-%dT%H:%MZ)" > "$RAPPORT"
          echecs=""
          # étape <nom> <commande...> : lance la commande, garde sa sortie dans le rapport, note l'échec sans s'arrêter
          etape() {
            local nom="$1"; shift
            echo "### $nom ($id)" | tee -a "$RAPPORT"
            "$@" 2>&1 | tee -a "$RAPPORT"
            [ "${PIPESTATUS[0]}" -eq 0 ] || echecs="$echecs $nom:$id"
          }
          for id in $TERRITOIRES; do
            echo "::group::$id"
            etape osm python3 outils/build_osm.py --territoire "$id"
            etape sources python3 outils/build_sources.py --territoire "$id"
            etape dvf python3 outils/build_dvf.py --territoire "$id"
            etape petiteenfance python3 outils/build_petite_enfance.py --territoire "$id"
            etape artisans python3 outils/build_artisans.py --territoire "$id"
            etape associations python3 outils/build_associations.py --territoire "$id"
            etape fichiers python3 outils/maj_fichiers_disponibles.py --territoire "$id"
            echo "::endgroup::"
          done
          echo "echecs=$echecs" >> "$GITHUB_OUTPUT"

      - name: Commit si les données ont changé
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add territoires
          if git diff --cached --quiet; then
            echo "Pas de changement dans les données."
            exit 0
          fi
          git commit -m "Mise à jour des données des territoires"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"

      - name: Signaler un échec
        if: steps.donnees.outputs.echecs != ''
        env:
          ECHECS: ${{ steps.donnees.outputs.echecs }}
        run: |
          echo "::error::Étapes en échec :${ECHECS}"
          exit 1
